name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Rebuild c0mpl1cated.me so it picks up new writeups and project changes.
  # Set the LAB_SITE_DEPLOY_HOOK repository secret to the Cloudflare Pages deploy hook URL.
  notify-lab-site:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.LAB_SITE_DEPLOY_HOOK }}
    steps:
      - name: Trigger c0mpl1cated.me rebuild
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
